[package]
name = "qdm"
version = "1.0.5"
edition = "2021"
description = "Quick Download Manager - Modern Open-Source Downloader in Rust & Iced"

# Expose internals as a library so the speed_debug binary can import them.
[lib]
name = "qdm"
path = "src/lib.rs"

[[bin]]
name = "qdm"
path = "src/main.rs"

[[bin]]
name = "speed_debug"
path = "src/bin/speed_debug.rs"

[dependencies]
iced = { version = "0.13", features = ["tokio", "image"] }
tokio = { version = "1", features = ["full"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
reqwest = { version = "0.13.4", features = ["stream", "json"] }
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
rfd = "0.15"
chrono = { version = "0.4", features = ["serde"] }
librqbit = "9.0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
tray-icon = "0.24"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Foundation"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[package.metadata.packager]
product-name = "QDM"
identifier = "shahstudioz.qdm.app"
category = "Utilities"
authors = ["ShahStudioz"]
description = "Quick Download Manager - Modern Open-Source Downloader in Rust & Iced"
long-description = "Quick Download Manager (QDM) is a fast, lightweight, and modern open-source download manager built with Rust and Iced. It supports segmented multi-connection HTTP/HTTPS downloads, BitTorrent/magnet links, speed throttling, scheduling, and automatic updates."
icons = [
    "assets/icons/32x32.png",
    "assets/icons/64x64.png",
    "assets/icons/128x128.png",
    "assets/icons/256x256.png",
    "assets/icons/512x512.png",
    "assets/icons/1024x1024.png",
    "assets/icons/icon.ico",
    "assets/icons/icon.icns"
]
resources = ["assets"]
out-dir = "dist"

[[package.metadata.packager.binaries]]
path = "qdm"
main = true

[package.metadata.packager.nsis]
installer-icon = "assets/icons/icon.ico"
installer-mode = "currentUser"
languages = ["English"]

[package.metadata.packager.deb]
depends = ["libc6", "libssl3 | libssl1.1", "libgtk-3-0", "libxdo3"]
# Custom .desktop template adds StartupWMClass so GNOME/KDE groups the running
# window with the dock icon. Also adds magnet URI handler and StartupNotify.
desktop-template = "packaging/qdm.desktop"
# Inject postinst/postrm maintainer scripts so the icon theme cache and
# desktop database are refreshed automatically on install and uninstall.
files = { "packaging/deb/postinst" = "DEBIAN/postinst", "packaging/deb/postrm" = "DEBIAN/postrm" }

[package.metadata.packager.appimage]
# Bundle essential dynamic libraries so QDM runs out-of-the-box on Ubuntu, Fedora,
# Arch, openSUSE, and other distributions without requiring users to run apt/dnf/pacman
# install for libayatana-appindicator3 or libssl.
libs = [
    "libayatana-appindicator3.so*",
    "libayatana-ido3-0.4.so*",
    "libdbusmenu-glib.so*",
    "libdbusmenu-gtk3.so*",
    "libxdo.so*",
    "libssl.so*",
    "libcrypto.so*",
]
# Use linuxdeploy-plugin-gtk to automatically deploy GTK3 runtime assets, schemas, modules, and themes
linuxdeploy-plugins = { "gtk" = "https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh" }


[package.metadata.packager.dmg]
