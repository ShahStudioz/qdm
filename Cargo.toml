[package]
name = "qdm"
version = "0.1.0"
edition = "2021"
description = "Quick Download Manager - Modern Open-Source Downloader in Rust & Iced"

# Expose internals as a library so the speed_debug binary can import them.
[lib]
name = "qdm"
path = "src/lib.rs"

[[bin]]
name = "qdm"
path = "src/main.rs"

[[bin]]
name = "speed_debug"
path = "src/bin/speed_debug.rs"

[dependencies]
iced = { version = "0.13", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
reqwest = { version = "0.13.4", features = ["stream", "json"] }
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
rfd = "0.15"
chrono = { version = "0.4", features = ["serde"] }
librqbit = "9.0.1"
