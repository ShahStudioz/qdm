name: Release QDM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v1.0.0). Leave empty to use version from Cargo.toml'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build & Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
            formats: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x64
            formats: deb,appimage
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x64
            formats: dmg
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
            formats: dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            pkg-config \
            libasound2-dev \
            libxdo-dev \
            patchelf

      - name: Install cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager

      - name: Build release binary
        run: cargo build --release --bin qdm --target ${{ matrix.target }}

      - name: Build macOS iconset with iconutil
        if: runner.os == 'macOS'
        run: |
          mkdir -p AppIcon.iconset
          cp assets/icons/16x16.png AppIcon.iconset/icon_16x16.png
          cp assets/icons/32x32.png AppIcon.iconset/icon_16x16@2x.png
          cp assets/icons/32x32.png AppIcon.iconset/icon_32x32.png
          cp assets/icons/64x64.png AppIcon.iconset/icon_32x32@2x.png
          cp assets/icons/128x128.png AppIcon.iconset/icon_128x128.png
          cp assets/icons/256x256.png AppIcon.iconset/icon_128x128@2x.png
          cp assets/icons/256x256.png AppIcon.iconset/icon_256x256.png
          cp assets/icons/512x512.png AppIcon.iconset/icon_256x256@2x.png
          cp assets/icons/512x512.png AppIcon.iconset/icon_512x512.png
          cp assets/icons/1024x1024.png AppIcon.iconset/icon_512x512@2x.png
          iconutil -c icns AppIcon.iconset -o assets/icons/icon.icns
          rm -rf AppIcon.iconset

      - name: Package with cargo-packager
        run: cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.formats }}

      - name: Ad-hoc codesign macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Find the .app bundle produced by cargo-packager
          APP_BUNDLE=$(find target/${{ matrix.target }}/release -name "*.app" -type d | head -n 1)
          if [ -z "$APP_BUNDLE" ]; then
            APP_BUNDLE=$(find dist -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_BUNDLE" ]; then
            echo "::warning::No .app bundle found to sign, skipping codesign"
            exit 0
          fi
          echo "Signing: $APP_BUNDLE"
          # Ad-hoc sign with hardened runtime
          codesign --force --deep --sign "-" --options runtime "$APP_BUNDLE"
          codesign --verify --verbose "$APP_BUNDLE"
          echo "Ad-hoc codesign complete"

          # Re-create the DMG with the signed app so the distributed DMG contains the signed binary
          DMG_FILE=$(find dist -name "*.dmg" -type f | head -n 1)
          if [ -n "$DMG_FILE" ]; then
            echo "Re-creating DMG with signed app: $DMG_FILE"
            MOUNT_DIR=$(mktemp -d)
            hdiutil attach "$DMG_FILE" -mountpoint "$MOUNT_DIR" -nobrowse -quiet
            STAGING_DIR=$(mktemp -d)
            cp -R "$MOUNT_DIR"/* "$STAGING_DIR"/ 2>/dev/null || true
            # Replace the unsigned app with the signed one
            rm -rf "$STAGING_DIR"/*.app
            cp -R "$APP_BUNDLE" "$STAGING_DIR"/
            hdiutil detach "$MOUNT_DIR" -quiet
            rm "$DMG_FILE"
            hdiutil create -volname "QDM" -srcfolder "$STAGING_DIR" -ov -format UDZO "$DMG_FILE"
            rm -rf "$MOUNT_DIR" "$STAGING_DIR"
            echo "DMG re-created with signed app"
          fi

      - name: Stage Artifacts & Compute Checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          if ((Get-ChildItem -Path dist -Include *.exe,*.msi -Recurse).Count -eq 0) {
            Get-ChildItem -Path target -Recurse -Include *setup.exe,*.msi | ForEach-Object {
              Copy-Item $_.FullName -Destination dist/
            }
          }
          Get-ChildItem -Path dist -File | Where-Object { $_.Name -notlike "*.sha256" } | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Stage Artifacts & Compute Checksums (Linux & macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          if [ -z "$(find dist -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \) 2>/dev/null)" ]; then
            find target -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" \) -exec cp {} dist/ \;
          fi
          cd dist
          for f in *; do
            if [ -f "$f" ] && [[ "$f" != *.sha256 ]]; then
              if [[ "$f" == *.dmg ]] && [[ "$f" != *x64* ]] && [[ "$f" != *x86_64* ]] && [[ "$f" != *aarch64* ]] && [[ "$f" != *arm64* ]]; then
                BASE="${f%.dmg}"
                NEW_NAME="${BASE}-${{ matrix.name }}.dmg"
                mv "$f" "$NEW_NAME"
                f="$NEW_NAME"
              fi
              sha256sum "$f" > "$f.sha256"
            fi
          done

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qdm-packages-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish-github-release:
    name: Publish GitHub Release
    needs: build-and-package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Download all built packages
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Consolidated SHA256SUMS
        shell: bash
        run: |
          cd release-artifacts
          rm -f SHA256SUMS.txt
          find . -maxdepth 1 -type f ! -name "*.sha256" -exec sha256sum {} + > SHA256SUMS.txt || true
          cat SHA256SUMS.txt

      - name: Determine Release Tag
        id: release_tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            CARGO_VER=$(grep '^version =' Cargo.toml | head -n1 | cut -d '"' -f2)
            TAG="v${CARGO_VER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Target release tag: ${TAG}"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Sync Release & Binaries to QDM Website
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          QDM_WEBSITE_URL: ${{ secrets.QDM_WEBSITE_URL }}
          QDM_RELEASE_API_KEY: ${{ secrets.QDM_RELEASE_API_KEY }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
          GITHUB_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if [ -z "$QDM_WEBSITE_URL" ] || [ -z "$QDM_RELEASE_API_KEY" ]; then
            echo "::warning::Skipping QDM Website sync: QDM_WEBSITE_URL or QDM_RELEASE_API_KEY secret is not configured."
            exit 0
          fi

          python3 - << 'EOF'
          import os, glob, json, urllib.request, urllib.error, subprocess

          website_url = os.environ["QDM_WEBSITE_URL"].rstrip("/")
          api_key = os.environ["QDM_RELEASE_API_KEY"].strip()
          tag = os.environ["RELEASE_TAG"].strip()
          repo = os.environ["GITHUB_REPO"].strip()

          try:
              changelog = subprocess.check_output(
                  ["git", "log", "-n", "15", "--pretty=format:- %s (%h)"],
                  text=True
              ).strip()
          except Exception:
              changelog = f"Automated production release {tag}."

          assets = []
          for filepath in sorted(glob.glob("release-artifacts/*")):
              filename = os.path.basename(filepath)
              if filename.endswith(".sha256") or filename == "SHA256SUMS.txt" or not os.path.isfile(filepath):
                  continue

              size_bytes = os.path.getsize(filepath)
              sha256_hash = None
              sha_file = filepath + ".sha256"
              if os.path.isfile(sha_file):
                  with open(sha_file, "r", encoding="utf-8") as sf:
                      sha256_hash = sf.read().strip().split()[0]

              download_url = f"https://github.com/{repo}/releases/download/{tag}/{filename}"
              assets.append({
                  "filename": filename,
                  "download_url": download_url,
                  "file_size_bytes": size_bytes,
                  "checksum_sha256": sha256_hash,
              })

          payload = {
              "version": tag,
              "title": f"QDM {tag}",
              "changelog": f"### Highlights in {tag}\n\n{changelog}",
              "is_published": True,
              "is_prerelease": any(x in tag.lower() for x in ["-alpha", "-beta", "-rc"]),
              "assets": assets,
          }

          endpoint = f"{website_url}/api/v1/releases/webhook"
          print(f"Syncing release {tag} ({len(assets)} assets) to {endpoint}...")

          req = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "Authorization": f"Bearer {api_key}",
                  "X-Release-Key": api_key,
                  "User-Agent": "QDM-GitHub-Actions-Release-Bot/1.0",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = resp.read().decode("utf-8")
                  print(f"Website response ({resp.status}): {body}")
          except urllib.error.HTTPError as e:
              err_body = e.read().decode("utf-8", errors="replace")
              print(f"::error::Website webhook failed with HTTP {e.code}: {err_body}")
              raise SystemExit(1)
          EOF
