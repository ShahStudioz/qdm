name: Release QDM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v1.0.0). Leave empty to use version from Cargo.toml'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build & Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
            formats: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x64
            formats: deb,appimage
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x64
            formats: dmg
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
            formats: dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            pkg-config \
            libasound2-dev \
            libxdo-dev \
            patchelf

      - name: Install cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager

      - name: Build release binary
        run: cargo build --release --bin qdm --target ${{ matrix.target }}

      - name: Build macOS iconset with iconutil
        if: runner.os == 'macOS'
        run: |
          mkdir -p AppIcon.iconset
          cp assets/icons/16x16.png AppIcon.iconset/icon_16x16.png
          cp assets/icons/32x32.png AppIcon.iconset/icon_16x16@2x.png
          cp assets/icons/32x32.png AppIcon.iconset/icon_32x32.png
          cp assets/icons/64x64.png AppIcon.iconset/icon_32x32@2x.png
          cp assets/icons/128x128.png AppIcon.iconset/icon_128x128.png
          cp assets/icons/256x256.png AppIcon.iconset/icon_128x128@2x.png
          cp assets/icons/256x256.png AppIcon.iconset/icon_256x256.png
          cp assets/icons/512x512.png AppIcon.iconset/icon_256x256@2x.png
          cp assets/icons/512x512.png AppIcon.iconset/icon_512x512.png
          cp assets/icons/1024x1024.png AppIcon.iconset/icon_512x512@2x.png
          iconutil -c icns AppIcon.iconset -o assets/icons/icon.icns
          rm -rf AppIcon.iconset

      - name: Package with cargo-packager
        run: cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.formats }}

      - name: Stage Artifacts & Compute Checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          if ((Get-ChildItem -Path dist -Include *.exe,*.msi -Recurse).Count -eq 0) {
            Get-ChildItem -Path target -Recurse -Include *setup.exe,*.msi | ForEach-Object {
              Copy-Item $_.FullName -Destination dist/
            }
          }
          Get-ChildItem -Path dist -File | Where-Object { $_.Name -notlike "*.sha256" } | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Stage Artifacts & Compute Checksums (Linux & macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          if [ -z "$(find dist -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \) 2>/dev/null)" ]; then
            find target -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" \) -exec cp {} dist/ \;
          fi
          cd dist
          for f in *; do
            if [ -f "$f" ] && [[ "$f" != *.sha256 ]]; then
              sha256sum "$f" > "$f.sha256"
            fi
          done

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qdm-packages-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish-github-release:
    name: Publish GitHub Release
    needs: build-and-package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built packages
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Consolidated SHA256SUMS
        shell: bash
        run: |
          cd release-artifacts
          rm -f SHA256SUMS.txt
          find . -maxdepth 1 -type f ! -name "*.sha256" -exec sha256sum {} + > SHA256SUMS.txt || true
          cat SHA256SUMS.txt

      - name: Determine Release Tag
        id: release_tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            CARGO_VER=$(grep '^version =' Cargo.toml | head -n1 | cut -d '"' -f2)
            TAG="v${CARGO_VER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Target release tag: ${TAG}"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
